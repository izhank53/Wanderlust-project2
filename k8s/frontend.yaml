apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: wanderlust

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: 085470048226.dkr.ecr.ap-south-2.amazonaws.com/wanderlust-dev-frontend:6389498aaed79c52e9dcdcb45bcb9f988e46043c

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: wanderlust

spec:
  selector:
    app: frontend

  ports:
    - port: 80
      targetPort: 80

  type: ClusterIP