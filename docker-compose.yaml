services: 
  mongodb:  #service name which doker uses to create a container and talk to other contaienr 
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db # mongodb-data is a named volume that docker manages and maps it to data/db inside container.
    networks:
      - wanderlust-network
   
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379" #ports on which redis will work
    networks:
      - wanderlust-network

  backend:
    build: ./backend
    restart: unless-stopped
    environment:  # enviroment variables we need for backend to connect to mongodb and redis
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/wanderlust
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"
    networks:
      - wanderlust-network
    depends_on:
      - mongodb
      - redis

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - wanderlust-network

volumes:
  mongodb-data:

networks:
  wanderlust-network:
  