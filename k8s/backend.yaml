apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: wanderlust

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: 085470048226.dkr.ecr.ap-south-2.amazonaws.com/wanderlust-dev-backend:dev

          ports:
            - containerPort: 5000

          env:
            - name: MONGODB_URI
              value: "mongodb://mongodb:27017/wanderlust"

            - name: REDIS_URL
              value: "redis://redis:6379"

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: wanderlust

spec:
  selector:
    app: backend

  ports:
    - port: 5000
      targetPort: 5000

  type: ClusterIP