name: Wanderlust

on:
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs: 
  backend:
    env:
      IMAGE_NAME: backend

    runs-on: ubuntu-latest

    steps:
      
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: 
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-backend-${{ hashFiles( 'backend/package-lock.json' ) }}
          restore-keys: |
            npm-backend-

      - run: npm ci
        working-directory: backend

      #- run: npm run lint 
      #  working-directory: backend

      - run: npm run test:ci
        working-directory: backend
       
      - uses: docker/login-action@v4
        with: 
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          no-cache: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DEBUG: "true"
        with:
          image-ref: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1"

      - run: |
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

 

  frontend:
    env:
      IMAGE_NAME: frontend

    runs-on: ubuntu-latest
    
    steps:
      
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: 
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-frontend-${{ hashFiles( 'frontend/package-lock.json' ) }}
          restore-keys: |
            npm-frontend-

      - run: npm ci
        working-directory: frontend

      # - run: npm run lint 
      #   working-directory: frontend

      # - run: npm run test
      #   working-directory: frontend

      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - uses: aquasecurity/trivy-action@v0.36.0
        with:   
          image-ref: ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL

      - run: |
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          