name: Wanderlust

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  # ============================================================
  # BACKEND
  # ============================================================

  backend:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: wanderlust-dev-backend
      ECR_REGISTRY: 085470048226.dkr.ecr.ap-south-2.amazonaws.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            npm-backend-

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      # - name: Lint
      #   run: npm run lint
      #   working-directory: backend

      - name: Run tests
        run: npm run test:ci
        working-directory: backend

      # ========================================================
      # OIDC DEBUG & AWS AUTHENTICATION
      # ========================================================

      - name: Debug GitHub OIDC Claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          separator = "&" if "?" in url else "?"
          url = url + separator + "audience=sts.amazonaws.com"

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"bearer {token}"
              }
          )

          with urllib.request.urlopen(req) as response:
              data = json.load(response)

          jwt = data["value"]
          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("=== GitHub OIDC Claims ===")
          print("aud:", claims.get("aud"))
          print("sub:", claims.get("sub"))
          print("repository:", claims.get("repository"))
          print("ref:", claims.get("ref"))
          print("repository_owner:", claims.get("repository_owner"))
          print("event_name:", claims.get("event_name"))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::085470048226:role/wanderlust-dev-github-actions-role
          aws-region: ap-south-2
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ========================================================
      # BUILD
      # ========================================================

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          no-cache: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ========================================================
      # SECURITY SCAN
      # ========================================================

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DEBUG: "true"
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "1"

      # ========================================================
      # PUSH TO ECR
      # ========================================================

      - name: Push backend image to ECR
        run: |
          docker push \
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}


  # ============================================================
  # FRONTEND
  # ============================================================

  frontend:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: wanderlust-dev-frontend
      ECR_REGISTRY: 085470048226.dkr.ecr.ap-south-2.amazonaws.com

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-frontend-

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # - name: Lint
      #   run: npm run lint
      #   working-directory: frontend

      # - name: Run tests
      #   run: npm run test
      #   working-directory: frontend

      # ========================================================
      # OIDC DEBUG & AWS AUTHENTICATION
      # ========================================================

      - name: Debug GitHub OIDC Claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          separator = "&" if "?" in url else "?"
          url = url + separator + "audience=sts.amazonaws.com"

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"bearer {token}"
              }
          )

          with urllib.request.urlopen(req) as response:
              data = json.load(response)

          jwt = data["value"]
          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("=== GitHub OIDC Claims ===")
          print("aud:", claims.get("aud"))
          print("sub:", claims.get("sub"))
          print("repository:", claims.get("repository"))
          print("ref:", claims.get("ref"))
          print("repository_owner:", claims.get("repository_owner"))
          print("event_name:", claims.get("event_name"))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::085470048226:role/wanderlust-dev-github-actions-role
          aws-region: ap-south-2
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ========================================================
      # BUILD
      # ========================================================

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ========================================================
      # SECURITY SCAN
      # ========================================================

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL

      # ========================================================
      # PUSH TO ECR
      # ========================================================

      - name: Push frontend image to ECR
        run: |
          docker push \
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}